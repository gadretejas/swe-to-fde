<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245c4b"/></marker></defs><rect width="900" height="310" rx="16" fill="#edf1e7"/><g font-family="Arial,sans-serif" fill="#172d2a"><text x="30" y="43" font-size="24" font-weight="bold">One engagement. A connected evidence chain.</text><g fill="white" stroke="#9bae91"><rect x="30" y="85" width="145" height="95" rx="9"/><rect x="205" y="85" width="145" height="95" rx="9"/><rect x="380" y="85" width="145" height="95" rx="9"/><rect x="555" y="85" width="145" height="95" rx="9"/><rect x="730" y="85" width="145" height="95" rx="9"/></g><g text-anchor="middle" font-size="16"><text x="102" y="122">Problem</text><text x="102" y="150" font-size="12">Workflow + impact</text><text x="277" y="122">Requirement</text><text x="277" y="150" font-size="12">Measurable behavior</text><text x="452" y="122">Design</text><text x="452" y="150" font-size="12">Boundaries + trade-offs</text><text x="627" y="122">Evidence</text><text x="627" y="150" font-size="12">Tests + observation</text><text x="802" y="122">Decision</text><text x="802" y="150" font-size="12">Proceed / revise / stop</text></g><g stroke="#245c4b" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M175 130H203"/><path d="M350 130H378"/><path d="M525 130H553"/><path d="M700 130H728"/></g><text x="30" y="232" font-size="17">At every link: assumptions · owner · validation · consequences if wrong</text><text x="30" y="273" font-size="14">A changed constraint can require revisiting every downstream commitment.</text></g></svg>
