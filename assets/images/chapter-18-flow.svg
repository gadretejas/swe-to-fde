<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245c4b"/></marker></defs><rect width="900" height="310" rx="16" fill="#edf1e7"/><g font-family="Arial,sans-serif" fill="#172d2a"><text x="30" y="43" font-size="24" font-weight="bold">A valid identity still needs a policy decision.</text><g fill="white" stroke="#9bae91"><rect x="30" y="85" width="240" height="65" rx="9"/><rect x="30" y="170" width="240" height="65" rx="9"/><rect x="350" y="120" width="220" height="90" rx="9"/><rect x="650" y="120" width="220" height="90" rx="9"/></g><g text-anchor="middle" font-size="16"><text x="150" y="112">Validated principal</text><text x="150" y="135" font-size="12">State + role + assignment</text><text x="150" y="197">Trusted resource attributes</text><text x="150" y="220" font-size="12">Warehouse + requested action</text><text x="460" y="155">Server-side policy</text><text x="460" y="180" font-size="12">Least privilege + deny by default</text><text x="760" y="155">Allow or deny</text><text x="760" y="180" font-size="12">Enforce + record audit outcome</text></g><g stroke="#245c4b" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M270 115L348 150"/><path d="M270 200L348 180"/><path d="M570 165H648"/></g><text x="30" y="280" font-size="14">Apply the boundary to reads, writes, exports, jobs, and downloads—not only the UI.</text></g></svg>
