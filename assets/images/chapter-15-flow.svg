<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245c4b"/></marker></defs><rect width="900" height="320" rx="16" fill="#edf1e7"/><g font-family="Arial,sans-serif" fill="#172d2a"><text x="30" y="43" font-size="24" font-weight="bold">From usage to evidence of value</text><g fill="white" stroke="#9bae91"><rect x="30" y="85" width="180" height="95" rx="9"/><rect x="250" y="85" width="180" height="95" rx="9"/><rect x="470" y="85" width="180" height="95" rx="9"/><rect x="690" y="85" width="180" height="95" rx="9"/></g><g text-anchor="middle" font-size="17"><text x="120" y="122">Define outcome</text><text x="120" y="150" font-size="12">Population + guardrails</text><text x="340" y="122">Observe work</text><text x="340" y="150" font-size="12">Tasks + comparable data</text><text x="560" y="122">Combine evidence</text><text x="560" y="150" font-size="12">Metrics + user research</text><text x="780" y="122">Make a decision</text><text x="780" y="150" font-size="12">Improve / expand / stop</text></g><g stroke="#245c4b" fill="none" stroke-width="2" marker-end="url(#a)"><path d="M210 130H248"/><path d="M430 130H468"/><path d="M650 130H688"/><path d="M780 180V230H120V182"/></g><text x="290" y="220" font-size="14">Measure again after a bounded change</text><text x="30" y="280" font-size="14">Activity is a signal. Customer outcomes require interpretation, quality checks, and context.</text></g></svg>
