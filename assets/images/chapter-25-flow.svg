<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280"><rect width="900" height="280" rx="16" fill="#edf3eb"/><g font-family="Arial,sans-serif" fill="#183e32"><text x="25" y="38" font-size="23" font-weight="bold">From text to a generated response</text><g fill="white" stroke="#35624e" stroke-width="2"><rect x="20" y="75" width="145" height="95" rx="10"/><rect x="195" y="75" width="175" height="95" rx="10"/><rect x="400" y="75" width="235" height="95" rx="10"/><rect x="665" y="75" width="215" height="95" rx="10"/></g><g text-anchor="middle" font-size="18"><text x="92" y="116">Text → tokens</text><text x="92" y="145">and token IDs</text><text x="282" y="116">Numerical</text><text x="282" y="145">representations</text><text x="517" y="116">Transformer layers</text><text x="517" y="145">attention + processing</text><text x="772" y="116">Next-token scores</text><text x="772" y="145">choose a token</text><text x="180" y="128">→</text><text x="385" y="128">→</text><text x="650" y="128">→</text></g><text x="25" y="215" font-size="18">Add the selected token to the sequence and repeat until stopping.</text><text x="25" y="247" font-size="16">Conceptual view: generated likelihood is not a factual verification score.</text></g></svg>
