<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc"><title id="title">Northstar pilot architecture</title><desc id="desc">Dispatcher and customer identity connect to a review API. A TMS read API feeds ingestion and a durable queue. A worker writes a local shipment view, which the review API uses alongside reviews and audit history. All pilot components report operational telemetry. Write-back to TMS is excluded.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#245c4b"/></marker></defs><rect width="920" height="620" rx="18" fill="#f7f8f2"/><g font-family="Arial,sans-serif" fill="#172d2a"><text x="32" y="39" font-size="23" font-weight="bold">Northstar · review-first pilot</text><text x="32" y="64" font-size="14">Responsibilities, dependencies, and ownership boundaries</text><rect x="25" y="90" width="225" height="480" rx="12" fill="#edf1e7" stroke="#a8b79c" stroke-dasharray="6 4"/><text x="42" y="118" font-size="15" font-weight="bold">CUSTOMER SYSTEMS</text><rect x="300" y="90" width="590" height="480" rx="12" fill="white" stroke="#a8b79c" stroke-dasharray="6 4"/><text x="320" y="118" font-size="15" font-weight="bold">PILOT · OPERATIONAL OWNER REQUIRED</text><g fill="#e4edda" stroke="#a8b79c"><rect x="45" y="150" width="180" height="65" rx="8"/><rect x="45" y="285" width="180" height="65" rx="8"/><rect x="45" y="420" width="180" height="65" rx="8"/><rect x="340" y="150" width="200" height="65" rx="8"/><rect x="650" y="150" width="200" height="65" rx="8"/><rect x="340" y="285" width="200" height="65" rx="8"/><rect x="650" y="285" width="200" height="65" rx="8"/><rect x="340" y="420" width="200" height="65" rx="8"/><rect x="650" y="420" width="200" height="65" rx="8"/></g><g font-size="16" text-anchor="middle"><text x="135" y="177">Dispatcher</text><text x="135" y="199" font-size="12">Review UI / browser</text><text x="135" y="312">Identity provider</text><text x="135" y="334" font-size="12">Customer-managed claims</text><text x="135" y="447">TMS read API</text><text x="135" y="469" font-size="12">Quota + cursor validation</text><text x="440" y="177">Review API</text><text x="440" y="199" font-size="12">Enforce depot authorization</text><text x="750" y="177">Reviews + audit</text><text x="750" y="199" font-size="12">Durable, versioned decisions</text><text x="440" y="312">Shipment read view</text><text x="440" y="334" font-size="12">Evidence + source timestamps</text><text x="750" y="312">Processing worker</text><text x="750" y="334" font-size="12">Normalize + deduplicate</text><text x="440" y="447">Ingestion + outbox</text><text x="440" y="469" font-size="12">Durable capture + cursor</text><text x="750" y="447">Bounded work queue</text><text x="750" y="469" font-size="12">Retry / quarantine / replay</text></g><g stroke="#245c4b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M225 180H338"/><path d="M540 180H648"/><path d="M225 305L338 210"/><path d="M440 215V283"/><path d="M225 450H338"/><path d="M540 450H648"/><path d="M750 420V352"/><path d="M650 318H542"/></g><g font-size="11" fill="#245c4b"><text x="252" y="169">HTTPS</text><text x="560" y="168">Commit</text><text x="449" y="255">Read</text><text x="245" y="441">Capture</text><text x="560" y="439">Publish</text><text x="758" y="389">Consume</text><text x="565" y="308">Upsert</text><text x="320" y="524" font-size="14">Telemetry: request quality · ingestion lag · queue age · denied access</text><text x="320" y="548" font-size="13">Out of scope: autonomous actions and TMS write-back</text><text x="32" y="600" font-size="13">Arrows show logical flow. Add environment-specific deployment and recovery views before launch.</text></g></g></svg>
